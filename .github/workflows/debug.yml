name: Geçici yakalama
on:
  push:
    paths: ["debug/capture.py"]
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python debug/capture.py
      - if: always()
        run: |
          git config user.name "fiyat-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/ && git commit -m "Yakalama sonucu" && git pull --rebase && git push
