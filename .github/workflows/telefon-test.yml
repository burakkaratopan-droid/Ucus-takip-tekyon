name: Geçici telefon betiği testi
on:
  push:
    paths: [".github/workflows/telefon-test.yml"]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python telefon.py --yerel 2>&1 | tee telefon-test.txt
      - run: |
          git config user.name "fiyat-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telefon-test.txt && git commit -m "Telefon betiği test çıktısı" && git pull --rebase && git push
