name: Fiyat taraması

on:
  schedule:
    # UTC saatleri; Türkiye saatiyle 07:00, 12:00, 19:00
    - cron: "0 4,9,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tarama
        run: python tracker.py
      - name: Sonuçları kaydet
        run: |
          git config user.name "fiyat-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Fiyat taraması $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
